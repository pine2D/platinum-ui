<!doctype html>
<html lang="en" data-platinum-scheme="light" data-platinum-controls="mac9" data-platinum-accent="lavender">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mac OS 9.0 window specimen</title>
  <link rel="stylesheet" href="../../dist/platinum.css">
  <link rel="stylesheet" href="window.css">
  <link rel="stylesheet" href="content.css">
  <script defer src="samples.js"></script>
  <script defer src="content.js"></script>
  <script defer src="window.js"></script>
</head>
<body>
  <main id="specimen" aria-label="Mac OS 9.0 window at original resolution">
    <section class="sample-window pt-window" inert>
      <header class="pt-titlebar">
        <button class="pt-tbox pt-tbox-close" type="button" aria-label="Close"></button>
        <span class="pt-titlebar-label"><span class="folder-proxy" aria-hidden="true"></span><span class="caption"></span></span>
        <button class="pt-tbox pt-tbox-zoom" type="button" aria-label="Zoom"></button>
        <button class="pt-tbox pt-tbox-minimize" type="button" aria-label="Collapse"></button>
      </header>
    </section>
  </main>
</body>
</html>
