name: Deploy Gallery to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tokens/**'
      - 'src/**'
      - 'dist/**'
      - 'gallery/**'
      - 'bin/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'tokens/**'
      - 'src/**'
      - 'dist/**'
      - 'gallery/**'
      - 'bin/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_VERSION: '1.59.1'
  CHROMIUM_VERSION: '147.0.7727.15'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pinned browser tooling (no runtime dependencies)
        run: |
          npm install --prefix "$RUNNER_TEMP/platinum-browser" --no-package-lock --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_MODULE_PATH=$RUNNER_TEMP/platinum-browser/node_modules/playwright" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/platinum-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Require the pinned Chromium before running the full suite
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { resolvePlaywright } from './bin/platinum-check.mjs';
          const pw = resolvePlaywright();
          assert.ok(pw, 'CI requires Playwright; browser tests must not skip');
          const require = createRequire(import.meta.url);
          assert.equal(require(`${process.env.PLAYWRIGHT_MODULE_PATH}/package.json`).version, process.env.PLAYWRIGHT_VERSION);
          const browser = await pw.chromium.launch();
          try { assert.equal(browser.version(), process.env.CHROMIUM_VERSION); }
          finally { await browser.close(); }
          NODE

      - name: Verify tokens, bundles, CSS gates, and all browser tests
        run: |
          npm run verify
          node bin/platinum-check.mjs --browser

      - name: Stage static gallery site
        run: node scripts/stage-pages.mjs

      - name: Check staged root and gallery URLs under a project subpath
        run: node scripts/check-pages.mjs

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
